<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCHOOL_RAN｜ProjectR 掉落資料匯入測試</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#192338;--line:#34445f;--muted:#9aabc5;--text:#edf3ff;--blue:#7eafff;--green:#7cdbad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d2c46,#101522 60%);color:var(--text);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:1080px;margin:auto;padding:30px 18px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:2px;color:#78d5d0;font-weight:700}.head h1{font-size:27px;margin:5px 0}.muted{color:var(--muted)}.badge{border:1px solid #3e715f;color:#9de9c3;background:#1c3b34;padding:6px 11px;border-radius:99px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.panel{background:#192338;border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:5px}.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 13px}.mapcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #425573;border-radius:11px;background:#202e46}.mapcard img{width:82px;height:70px;object-fit:cover;background:#101522;border-radius:8px}.mapcard b{display:block}.moblist{display:grid;gap:8px;margin-top:13px}.mob{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:#202e46;border:1px solid #334765;border-radius:10px;color:var(--text);padding:10px;cursor:pointer}.mob.active{border-color:var(--blue);background:#2a3d5d}.mob img{width:46px;height:46px;object-fit:contain;background:#111a2a;border-radius:8px}.mob small{display:block;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input{flex:1;min-width:180px;background:#101a2b;border:1px solid var(--line);border-radius:9px;color:white;padding:10px}.drops{display:grid;gap:9px}.drop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:#202e46;border:1px solid #334765;border-radius:11px;padding:11px}.drop img{width:42px;height:42px;object-fit:contain;background:#101522;border-radius:8px}.drop b{display:block}.drop small{color:var(--muted)}.rarity{font-size:11px;padding:4px 9px;border-radius:99px;background:#2f405b;color:#c9dcff}.rarity.uncommon{background:#244d42;color:#a4ebc8}.rarity.rare{background:#4d3e28;color:#f1d28d}.foot{margin-top:16px;color:var(--muted);font-size:12px}.source a{color:#a9c9ff}.empty{padding:34px;text-align:center;color:var(--muted)}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.head h1{font-size:22px}}
</style></head><body><main class="wrap">
<header class="head"><div><div class="eyebrow">SCHOOL_RAN / DATA IMPORT TEST</div><h1>ProjectR 怪物掉落資料</h1><div class="muted">正式匯入測試樣本 · 保留原始 ID、名稱、稀有度與圖片路徑</div></div><span class="badge">✓ 測試資料已載入</span></header>
<section class="stats"><div class="stat"><small>地圖</small><b id="mapCount">—</b></div><div class="stat"><small>怪物</small><b id="mobCount">—</b></div><div class="stat"><small>道具</small><b id="itemCount">—</b></div><div class="stat"><small>掉落關聯</small><b id="dropCount">—</b></div></section>
<div class="layout"><section class="panel"><h2>地圖 / 怪物</h2><div id="mapInfo" class="mapcard"></div><div id="mobList" class="moblist"></div></section>
<section class="panel"><div class="toolbar"><div><h2 style="margin:0">怪物掉落清單</h2><div id="mobInfo" class="muted"></div></div><input id="filter" placeholder="搜尋道具名稱 / ID"></div><div id="drops" class="drops"></div></section></div>
<p class="foot source">來源：<a href="https://projectr.games/drop-guide/?map=2%3A0&mob=0%3A0" target="_blank" rel="noopener">ProjectR Drop Guide</a> · JSON revision 20261004-2。此頁只匯入 Sacred Gate Campus 的 1 隻怪物作為第一階段驗證；其餘 72 張地圖與 230 隻怪物尚未匯入。來源圖片由 ProjectR 網站提供。</p>
</main><script>
(async()=>{const $=s=>document.querySelector(s);const base='https://projectr.games';let db,selected='0:0';try{const r=await fetch('https://raw.githubusercontent.com/carmenykm-oss/SCHOOL_RAN/main/data/projectr-drop-guide-sample.json');if(!r.ok)throw Error('HTTP '+r.status);db=await r.json()}catch(e){$('#drops').innerHTML='<div class="empty">資料載入失敗：'+e.message+'</div>';return}
const maps=db.maps||[],mobs=db.mobs||{},items=db.items||{};const mobIds=maps[0]?.mobs||[];$('#mapCount').textContent=maps.length;$('#mobCount').textContent=Object.keys(mobs).length;$('#itemCount').textContent=Object.keys(items).length;$('#dropCount').textContent=Object.values(mobs).reduce((n,m)=>n+m.drops.length,0);
const map=maps[0];$('#mapInfo').innerHTML='<img src="'+base+map.image+'" onerror="this.style.visibility=\'hidden\'"><div><b>'+map.name+'</b><small class="muted">地圖 ID '+map.id+' · 等級 '+map.minLevel+'–'+map.maxLevel+'</small></div>';
function showMob(id){selected=id;const m=mobs[id];document.querySelectorAll('.mob').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('#mobInfo').textContent=m.nameZh+' · '+m.name+' · Lv.'+m.level+' · '+m.drops.length+' 項掉落';renderDrops()}
function renderDrops(){const m=mobs[selected],q=$('#filter').value.toLowerCase();const rows=m.drops.map(d=>({d,i:items[d.item]})).filter(x=>x.i&&(!q||(x.i.name+' '+x.i.nameZh+' '+x.i.id).toLowerCase().includes(q)));$('#drops').innerHTML=rows.length?rows.map(({d,i})=>'<div class="drop"><img src="'+base+i.icon+'" onerror="this.style.visibility=\'hidden\'"><div><b>'+i.nameZh+' <span class="muted">/ '+i.name+'</span></b><small>ID '+i.id+' · '+i.category+'</small></div><span class="rarity '+d.rarity+'">'+d.rarity+'</span></div>').join(''):'<div class="empty">找不到符合的掉落物</div>'}
$('#mobList').innerHTML=mobIds.map(id=>{const m=mobs[id];return '<button class="mob '+(id===selected?'active':'')+'" data-id="'+id+'"><img src="'+base+m.image+'" onerror="this.style.visibility=\'hidden\'"><span><b>'+m.nameZh+' '+m.name+'</b><small>ID '+id+' · Lv.'+m.level+' · '+m.drops.length+' drops</small></span></button>'}).join('');
$('#mobList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)showMob(b.dataset.id)});$('#filter').addEventListener('input',renderDrops);showMob(selected)
})()
</script></body></html>

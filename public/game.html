<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SCHOOL_RAN｜校園冒險測試</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#1b2939;--line:#40556d;--gold:#f4cf75;--mint:#80e0bb;--text:#f4f4e9;--muted:#aab8c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#293b4d,#101722 65%);color:var(--text);font:14px/1.45 system-ui,"Noto Sans TC",sans-serif}
button,select{font:inherit;color:inherit;background:#2a4055;border:1px solid #506b84;border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}
header{height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid #35495d;background:#111d2a}
.brand{font-weight:900;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}
.head-actions{display:flex;gap:8px;align-items:center}.layout{max-width:1440px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.stage{min-width:0}.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.hudbox{background:#1b2a39;border:1px solid #40566d;border-radius:9px;padding:8px 12px;min-width:100px;flex:1}.hudbox b{display:block;font-size:12px;color:#d5e3eb;margin-bottom:5px}.bar{height:9px;border-radius:8px;background:#09131e;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#d95d68}.bar.mp i{background:#5c9ce8}.bar.exp i{background:#e4bc5b}
.gameframe{position:relative;border:2px solid #617d91;border-radius:13px;overflow:hidden;background:#476d4e;box-shadow:0 18px 50px #0008}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;image-rendering:pixelated;touch-action:none}
.overlay{position:absolute;inset:0;pointer-events:none}.hint{position:absolute;left:12px;top:10px;background:#0d1a20c9;padding:7px 10px;border-radius:7px;color:#e3eddb;font-size:12px}.toast{position:absolute;left:50%;top:17%;transform:translateX(-50%);background:#122333ed;border:1px solid #b8d8dc;padding:9px 14px;border-radius:9px;opacity:0;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}
.target{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#142231dd;padding:7px 13px;border:1px solid #667e91;border-radius:9px;font-size:12px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.battlebar{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.battlebar button{min-width:105px;padding:10px 14px;font-weight:700}.attack{background:#7d3842;border-color:#c16b71}.skill{background:#345a86;border-color:#719dd2}.side{display:flex;flex-direction:column;gap:10px;min-width:0}.panel{background:linear-gradient(150deg,#1d2d3e,#172331);border:1px solid #40566d;border-radius:12px;padding:13px;box-shadow:0 8px 22px #0003}.panel h3{margin:0 0 10px;font-size:14px;color:#f3d68d}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#0e1925;border-radius:7px;padding:7px 9px;color:#aebdca;font-size:11px}.stat b{display:block;color:#fff;font-size:15px}.inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.slot{min-height:54px;background:#101b27;border:1px solid #354c61;border-radius:7px;padding:6px;text-align:center;font-size:11px;overflow:hidden}.slot b{display:block;color:#f3d68d;font-size:12px}.slot button{padding:3px 5px;font-size:10px;margin-top:3px}.equiplist{display:grid;gap:5px}.equiprow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #34495d;padding:5px 0;font-size:12px}.equiprow span{color:#aebdca}.log{height:120px;overflow:auto;background:#0d1823;border-radius:8px;padding:8px;font-size:11px;color:#bdcbd3}.log p{margin:0 0 5px}
.dpad{display:none;position:absolute;left:12px;bottom:12px;pointer-events:auto;grid-template-columns:38px 38px 38px;grid-template-rows:38px 38px 38px;gap:3px}.dpad button{padding:0;background:#16283bcc;border-color:#b4c8d5a8;font-size:17px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.mobilehit{display:none;position:absolute;right:14px;bottom:24px;pointer-events:auto;border-radius:50%;width:68px;height:68px;background:#873d48e8;border:2px solid #e49a8f;font-weight:900}
.smallnote{font-size:11px;color:#aab8c5;line-height:1.5}.warn{color:#f1c978}.green{color:#8be0b7}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .logpanel{grid-column:1/-1}.hudbox{min-width:75px}.dpad,.mobilehit{display:grid}.mobilehit{display:block}}
@media(max-width:560px){header{padding:8px 10px;height:56px}.head-actions button{padding:6px 8px;font-size:11px}.layout{padding:8px;gap:8px}.side{grid-template-columns:1fr}.side .logpanel{grid-column:auto}.hudbox{padding:6px 8px}.hudbox b{font-size:10px}.battlebar button{flex:1;min-width:0}.hint{font-size:10px}.target{font-size:10px}}
</style>
</head>
<body>
<header><div class="brand">SCHOOL_RAN <small>CAMPUS ADVENTURE · 0.6 PLAYTEST</small></div><div class="head-actions"><button id="backEditor">資料編輯器</button><button id="reset">重置測試角色</button></div></header>
<main class="layout">
<section class="stage">
<div class="hud">
 <div class="hudbox"><b id="playerLabel">新生 Lv.1</b><div class="bar"><i id="hpbar"></i></div><small id="hptext">HP 100 / 100</small></div>
 <div class="hudbox"><b>MP</b><div class="bar mp"><i id="mpbar"></i></div><small id="mptext">MP 60 / 60</small></div>
 <div class="hudbox"><b>EXP</b><div class="bar exp"><i id="expbar"></i></div><small id="exptext">0 / 100</small></div>
 <div class="hudbox"><b>職業</b><select id="job"><option value="warrior">戰士</option><option value="archer">弓箭手</option><option value="fighter">格鬥家</option><option value="mage">氣功師</option></select></div>
</div>
<div class="gameframe"><canvas id="world" width="960" height="600"></canvas><div class="overlay"><div class="hint">WASD / 方向鍵移動　Space 攻擊　點選怪物鎖定</div><div id="toast" class="toast"></div><div id="target" class="target">尚未鎖定目標</div><div class="dpad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><button class="mobilehit" id="mobileAttack">攻擊</button></div></div>
<div class="battlebar"><button class="attack" id="attack">⚔ 普通攻擊 [Space]</button><button class="skill" id="skill">✦ 職業技能</button><button id="potion">♥ 使用生命藥水</button></div>
</section>
<aside class="side">
 <section class="panel"><h3>角色能力</h3><div class="stats"><div class="stat">攻擊力<b id="atk">18</b></div><div class="stat">防禦力<b id="def">3</b></div><div class="stat">等級<b id="level">1</b></div><div class="stat">金幣<b id="gold">0</b></div></div><p class="smallnote" id="statnote">裝備屬性會即時計入角色能力。</p></section>
 <section class="panel"><h3>裝備欄</h3><div class="equiplist" id="equipment"></div></section>
 <section class="panel"><h3>背包 <span class="smallnote" id="bagcount"></span></h3><div class="inventory" id="bag"></div></section>
 <section class="panel logpanel"><h3>冒險紀錄</h3><div class="log" id="log"></div></section>
 <section class="panel"><h3>資料連線狀態</h3><div class="smallnote" id="dbstatus">正在讀取伺服器資料…</div></section>
</aside>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('world'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height,KEYS=new Set();
const monsterSprites=new Map();
function spriteFor(monster){
 const path=monster.data.sprite||((/slime|史萊姆|俗辣/i.test((monster.data.id||'')+' '+(monster.data.name||'')))?'/assets/monsters/campus-slime.svg':'');
 if(!path)return null;
 if(!monsterSprites.has(path)){const img=new Image();img.src=path;monsterSprites.set(path,img)}
 const img=monsterSprites.get(path);return img.complete&&img.naturalWidth?img:null;
}
let db=null, monsters=[], selected=null, last=0, lastHit=0, lastSkill=0, toastTimer=0, running=true;
const jobs={warrior:{name:'戰士',atk:20,def:5,hp:130,mp:55,color:'#d65e52',range:58},archer:{name:'弓箭手',atk:17,def:3,hp:100,mp:75,color:'#75a8d5',range:150},fighter:{name:'格鬥家',atk:19,def:4,hp:115,mp:65,color:'#e2a34e',range:65},mage:{name:'氣功師',atk:22,def:2,hp:90,mp:100,color:'#a88be0',range:155}};
const fresh=()=>({name:'新生',job:'warrior',level:1,exp:0,hp:130,mp:55,gold:0,x:480,y:340,bag:[{id:'test_bread',name:'校園麵包',kind:'item',quantity:3,effect:'hp',amount:35}],equipment:{'武器':null,'頭盔':null,'上衣':null,'手套':null,'褲子':null,'鞋子':null,'飾品':null}});
let player=loadPlayer();
function loadPlayer(){try{const p=JSON.parse(localStorage.getItem('school-ran-player-v06'));return p&&p.bag&&p.equipment?{...fresh(),...p}:fresh()}catch{return fresh()}}
function save(){localStorage.setItem('school-ran-player-v06',JSON.stringify(player))}
function say(msg){const log=$('log'),p=document.createElement('p');p.textContent='› '+msg;log.prepend(p);while(log.children.length>35)log.lastChild.remove()}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function stats(){const j=jobs[player.job]||jobs.warrior;let atk=j.atk+player.level*2,def=j.def+Math.floor(player.level/2),hp=j.hp+player.level*12;for(const e of Object.values(player.equipment)){if(e){atk+=Number(e.attack)||0;def+=Number(e.defense)||0;hp+=Number(e.hp)||0}}return{atk,def,maxHp:hp,maxMp:j.mp+player.level*5,range:j.range}}
function persist(){const s=stats();player.hp=clamp(player.hp,0,s.maxHp);player.mp=clamp(player.mp,0,s.maxMp);save();renderUI()}
function renderUI(){const s=stats();$('playerLabel').textContent=player.name+' Lv.'+player.level;$('hpbar').style.width=(player.hp/s.maxHp*100)+'%';$('mpbar').style.width=(player.mp/s.maxMp*100)+'%';$('expbar').style.width=(player.exp/expNeed()*100)+'%';$('hptext').textContent='HP '+Math.ceil(player.hp)+' / '+s.maxHp;$('mptext').textContent='MP '+Math.ceil(player.mp)+' / '+s.maxMp;$('exptext').textContent=player.exp+' / '+expNeed();$('atk').textContent=s.atk;$('def').textContent=s.def;$('level').textContent=player.level;$('gold').textContent=player.gold;$('equipment').innerHTML='';for(const slot of Object.keys(player.equipment)){const e=player.equipment[slot],row=document.createElement('div');row.className='equiprow';const left=document.createElement('span');left.textContent=slot;const right=document.createElement('b');right.textContent=e?e.name+' (+'+(Number(e.attack)||0)+' ATK / +'+(Number(e.defense)||0)+' DEF)':'未裝備';row.append(left,right);if(e){const btn=document.createElement('button');btn.textContent='卸下';btn.onclick=()=>unequip(slot);row.append(btn)}$('equipment').append(row)}renderBag();$('job').value=player.job}
function expNeed(){return player.level*100}
function renderBag(){$('bag').innerHTML='';$('bagcount').textContent='('+player.bag.length+' 格)';if(!player.bag.length){$('bag').innerHTML='<div class="smallnote">背包目前是空的</div>';return}for(let i=0;i<player.bag.length;i++){const item=player.bag[i],slot=document.createElement('div');slot.className='slot';const name=document.createElement('b');name.textContent=item.name;const qty=document.createElement('span');qty.textContent='×'+item.quantity;slot.append(name,qty);if(item.kind==='equipment'){const btn=document.createElement('button');btn.textContent='裝備';btn.onclick=()=>equip(i);slot.append(btn)}else if(item.effect==='hp'||item.effect==='mp'){const btn=document.createElement('button');btn.textContent='使用';btn.onclick=()=>useItem(i);slot.append(btn)}$('bag').append(slot)}}
function itemById(id){return [...(db?.items||[]),...(db?.equipment||[])].find(x=>x.id===id)}
function addBag(item){const found=player.bag.find(x=>x.id===item.id);if(found)found.quantity+=item.quantity;else if(player.bag.length<32)player.bag.push(item);else{player.gold+=Math.max(1,item.quantity);say('背包已滿，轉換成少量金幣。');}}
function equip(i){const item=player.bag[i],source=(db?.equipment||[]).find(x=>x.id===item.id);if(!source)return;const slot=source.slot||'武器';if(!(slot in player.equipment)){toast('不支援的裝備部位：'+slot);return}const old=player.equipment[slot];player.equipment[slot]={...source};player.bag.splice(i,1);if(old)addBag({id:old.id,name:old.name,kind:'equipment',quantity:1});say('已裝備 '+source.name);persist()}
function unequip(slot){const old=player.equipment[slot];if(!old)return;if(player.bag.length>=32){toast('背包已滿');return}player.bag.push({id:old.id,name:old.name,kind:'equipment',quantity:1});player.equipment[slot]=null;persist();say('卸下 '+old.name)}
function useItem(i){const item=player.bag[i],s=stats();if(item.effect==='hp'){player.hp=clamp(player.hp+(Number(item.amount)||35),0,s.maxHp)}else if(item.effect==='mp'){player.mp=clamp(player.mp+(Number(item.amount)||30),0,s.maxMp)}else{toast('這個道具暫時沒有使用效果');return}item.quantity--;if(item.quantity<=0)player.bag.splice(i,1);persist();say('使用 '+item.name)}
function levelUp(){while(player.exp>=expNeed()){player.exp-=expNeed();player.level++;const s=stats();player.hp=s.maxHp;player.mp=s.maxMp;say('升級！目前 Lv.'+player.level);toast('LEVEL UP! Lv.'+player.level)}}
function spawn(){const list=(db?.monsters||[]);if(!list.length)return;const chosen=list[Math.floor(Math.random()*list.length)];const lv=Math.max(1,Number(chosen.level)||1);const hasHp=Number(chosen.hp)>0;const m={data:chosen,x:90+Math.random()*(W-180),y:90+Math.random()*(H-180),hp:hasHp?Number(chosen.hp):50+lv*18,maxHp:hasHp?Number(chosen.hp):50+lv*18,atk:Number(chosen.attack)>0?Number(chosen.attack):4+lv*1.4,def:Number(chosen.defense)>0?Number(chosen.defense):Math.floor(lv*.6),exp:Number(chosen.exp)>0?Number(chosen.exp):lv*12,goldFallback:2+lv,dead:false,respawnAt:0,flash:0,phase:Math.random()*6};return m}
function initMonsters(){monsters=[];for(let i=0;i<Math.min(7,db.monsters.length);i++)monsters.push(spawn());say('已從資料庫載入 '+db.monsters.length+' 種怪物資料。');if(db.monsters.some(m=>!Number(m.hp)||!Number(m.attack)||!Number(m.exp)))say('注意：部分匯入怪物戰鬥數值為 0，測試場景暫用等級公式估算；不會覆寫資料庫。')}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function attack(skill=false){const now=performance.now(),cool=skill?1250:520;if(now-(skill?lastSkill:lastHit)<cool)return;if(skill&&player.mp<18){toast('MP 不足');return}let target=selected&&!selected.dead?selected:monsters.filter(m=>!m.dead).sort((a,b)=>distance(player,a)-distance(player,b))[0];if(!target){toast('附近沒有可攻擊的怪物');return}const s=stats(),reach=skill?Math.max(s.range,85):s.range;if(distance(player,target)>reach+18){toast('目標太遠，請靠近一點');return}if(skill){player.mp-=18;lastSkill=now}else lastHit=now;const power=skill?2.2:1,damage=Math.max(1,Math.round((s.atk-target.def*.45)*power));target.hp=Math.max(0,target.hp-damage);target.flash=.18;selected=target;say((skill?'技能攻擊':'普通攻擊')+' '+target.data.name+'，造成 '+damage+' 傷害');if(target.hp<=0)defeat(target);persist()}
async function defeat(m){m.dead=true;m.respawnAt=performance.now()+Math.max(5,Number(m.data.respawn)||8)*1000;selected=null;try{const res=await fetch('/api/game/monsters/'+encodeURIComponent(m.data.id)+'/defeat',{method:'POST'});if(!res.ok)throw new Error('結算失敗');const reward=await res.json();const exp=Number(reward.exp)>0?Number(reward.exp):m.exp;const gold=Number(reward.gold)>0?Number(reward.gold):m.goldFallback;player.exp+=exp;player.gold+=gold;for(const drop of reward.drops||[]){const src=itemById(drop.itemId);addBag({id:drop.itemId,name:drop.name,kind:drop.kind,quantity:drop.quantity,effect:src?.effect||'',amount:src?.amount||0});say('取得 '+drop.name+' ×'+drop.quantity)}say(m.data.name+' 被擊敗！EXP +'+exp+'、金幣 +'+gold);if(!(reward.drops||[]).length&&m.data.drops?.length)say('本次沒有掉落物（資料庫掉率為 0 的項目不會掉落）。');levelUp();persist()}catch(e){say('獎勵結算連線失敗：'+e.message)}}
function update(dt){const speed=190*dt;let dx=0,dy=0;if(KEYS.has('ArrowLeft')||KEYS.has('a'))dx--;if(KEYS.has('ArrowRight')||KEYS.has('d'))dx++;if(KEYS.has('ArrowUp')||KEYS.has('w'))dy--;if(KEYS.has('ArrowDown')||KEYS.has('s'))dy++;if(dx||dy){const n=Math.hypot(dx,dy);player.x=clamp(player.x+dx/n*speed,25,W-25);player.y=clamp(player.y+dy/n*speed,45,H-25)}
const now=performance.now();for(const m of monsters){if(m.dead){if(now>=m.respawnAt){const freshM=spawn();Object.assign(m,freshM);say(m.data.name+' 已重新出現')}continue}m.phase+=dt*3;m.flash=Math.max(0,m.flash-dt);const d=distance(player,m);if(d<190&&d>34){m.x+=((player.x-m.x)/d)*dt*42;m.y+=((player.y-m.y)/d)*dt*42}else if(d<=34&&now-(m.lastAttack||0)>1450){m.lastAttack=now;const damage=Math.max(1,Math.round(m.atk-stats().def*.55));player.hp=Math.max(0,player.hp-damage);say(m.data.name+' 攻擊你，受到 '+damage+' 傷害');if(player.hp<=0){player.hp=Math.max(1,Math.round(stats().maxHp*.45));player.x=480;player.y=340;player.gold=Math.max(0,player.gold-5);toast('你暫時失去戰鬥能力，已返回安全區');say('角色在安全區恢復，損失 5 金幣。')}persist()}}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawMap(){rect(0,0,W,H,'#58875a');for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32){rect(x,y,31,31,((x/32+y/32)%2?'#5b895c':'#608e60'));if((x*7+y*3)%11===0){rect(x+7,y+8,3,3,'#85a66a');rect(x+19,y+22,2,2,'#3f754d')}}rect(0,0,W,22,'#496d4e');rect(0,H-20,W,20,'#496d4e');
 // campus stone path and school wall
 rect(0,250,W,76,'#b8aa83');for(let x=0;x<W;x+=48){rect(x,250,46,2,'#d8c9a0');rect(x+46,250,2,76,'#9a8e70')}
 rect(330,30,300,135,'#c7b28b');rect(350,48,260,102,'#e5d4ad');rect(370,65,55,50,'#78a4b0');rect(455,65,55,50,'#78a4b0');rect(540,65,55,50,'#78a4b0');rect(440,116,80,34,'#875d45');rect(330,30,300,9,'#784e3c');rect(330,30,12,135,'#784e3c');rect(618,30,12,135,'#784e3c');rect(440,15,80,17,'#a94f46');
 // flower beds
 for(const x of [55,760]){rect(x,90,130,42,'#356b45');for(let i=0;i<10;i++){rect(x+8+i*11,99+(i%2)*9,5,5,['#e8c76e','#e68d9a','#f1e4be'][i%3])}}
 for(const x of [55,780]){rect(x,395,100,90,'#477849');for(let i=0;i<6;i++){rect(x+12+(i%3)*25,405+Math.floor(i/3)*32,18,18,'#34704b');rect(x+17+(i%3)*25,401+Math.floor(i/3)*32,8,8,'#6b9a58')}}
 // benches
 for(const x of [270,670]){rect(x,385,58,8,'#80583c');rect(x+4,393,5,12,'#5a3d2e');rect(x+49,393,5,12,'#5a3d2e')}
}
function drawShadow(x,y){ctx.fillStyle='#18332366';ctx.beginPath();ctx.ellipse(x,y+13,15,6,0,0,Math.PI*2);ctx.fill()}
function drawPlayer(){drawShadow(player.x,player.y);const c=jobs[player.job].color;rect(player.x-8,player.y-22,16,22,c);rect(player.x-10,player.y-31,20,13,'#f0c39a');rect(player.x-11,player.y-35,22,7,'#40352e');rect(player.x-6,player.y-18,5,18,'#354253');rect(player.x+2,player.y-18,5,18,'#354253');rect(player.x-12,player.y-2,8,4,'#ddd4bd');rect(player.x+4,player.y-2,8,4,'#ddd4bd');rect(player.x-6,player.y-27,3,3,'#272c35');rect(player.x+4,player.y-27,3,3,'#272c35');ctx.strokeStyle='#f9e6a2';ctx.strokeRect(player.x-12,player.y-37,24,42)}
function drawMonster(m){if(m.dead)return;drawShadow(m.x,m.y);const bob=Math.sin(m.phase)*2,img=spriteFor(m);if(img){const w=64,h=60;ctx.imageSmoothingEnabled=false;if(m.flash){ctx.save();ctx.globalAlpha=.65;ctx.drawImage(img,m.x-w/2,m.y-h+12+bob,w,h);ctx.restore()}else ctx.drawImage(img,m.x-w/2,m.y-h+12+bob,w,h)}else{const hue=m.data.id.includes('wolf')?'#9b8263':m.data.id.includes('golem')?'#8b8e8a':m.data.name.includes('豬')?'#d18a87':'#72c7b0';rect(m.x-14,m.y-19+bob,28,25,m.flash?'#fff':hue);rect(m.x-10,m.y-26+bob,20,11,hue);rect(m.x-8,m.y-22+bob,4,4,'#26313a');rect(m.x+4,m.y-22+bob,4,4,'#26313a');rect(m.x-11,m.y+3+bob,7,6,'#485b4e');rect(m.x+4,m.y+3+bob,7,6,'#485b4e')}ctx.fillStyle='#16232bdc';ctx.fillRect(m.x-27,m.y-42,54,5);ctx.fillStyle='#df5960';ctx.fillRect(m.x-26,m.y-41,52*Math.max(0,m.hp/m.maxHp),3);ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(m.data.name,m.x,m.y-48);if(selected===m){ctx.strokeStyle='#ffe08a';ctx.lineWidth=2;ctx.strokeRect(m.x-34,m.y-51,68,64)}}
function draw(){ctx.clearRect(0,0,W,H);drawMap();for(const m of monsters)drawMonster(m);drawPlayer();if(selected&&!selected.dead){$('target').textContent='目標：'+selected.data.name+'　HP '+Math.ceil(selected.hp)+' / '+selected.maxHp}else $('target').textContent='尚未鎖定目標 · 靠近怪物後按攻擊'}
function loop(t){if(!running)return;const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
async function boot(){try{const res=await fetch('/api/game-data',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);db=await res.json();if(!Array.isArray(db.monsters)||!Array.isArray(db.items)||!Array.isArray(db.equipment))throw new Error('遊戲資料格式不完整');$('dbstatus').innerHTML='<span class="green">已連線</span>：'+db.monsters.length+' 種怪物、'+db.items.length+' 種道具、'+db.equipment.length+' 件裝備、'+(db.skills||[]).length+' 個技能。';initMonsters();renderUI();say('校園冒險測試開始。使用 WASD 移動，Space 攻擊。');requestAnimationFrame(loop)}catch(e){$('dbstatus').innerHTML='<span class="warn">無法連接伺服器：</span>'+e.message+'。請先在專案資料夾執行 npm start。';toast('請先啟動 npm start')}}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();KEYS.add(e.key.length===1?e.key.toLowerCase():e.key);if(e.code==='Space'&&!e.repeat)attack(false)});window.addEventListener('keyup',e=>KEYS.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>KEYS.clear());
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const found=monsters.filter(m=>!m.dead&&Math.hypot(m.x-x,m.y-y)<34).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(found){selected=found;toast('已鎖定 '+found.data.name)}});
$('attack').onclick=()=>attack(false);$('mobileAttack').onclick=()=>attack(false);$('skill').onclick=()=>attack(true);$('potion').onclick=()=>{const i=player.bag.findIndex(x=>x.effect==='hp');if(i>=0)useItem(i);else toast('背包沒有生命藥水')};$('job').onchange=e=>{player.job=e.target.value;const s=stats();player.hp=s.maxHp;player.mp=s.maxMp;persist();say('已轉職為 '+jobs[player.job].name)};
document.querySelectorAll('[data-dir]').forEach(b=>{const key={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();KEYS.add(key)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>KEYS.delete(key)))});
$('backEditor').onclick=()=>location.href='/data-manager.html';$('reset').onclick=()=>{if(confirm('確定重置測試角色等級、背包和裝備？')){player=fresh();save();renderUI();say('測試角色已重置。')}};
renderUI();boot();
</script>
</body></html>

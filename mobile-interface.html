<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#253b31"><title>亂校園｜手機介面測試</title>
<style>
:root{--ink:#302b29;--cream:#f4e8c7;--gold:#e7bd68;--panel:#594633;--panel2:#806344;--blue:#4b7890;--red:#c65c50;--green:#6e9b58}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1e2d29;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none}
#game{position:relative;width:100vw;height:100vh;height:100dvh;min-height:0;overflow:hidden;background:#78a85d;image-rendering:pixelated;user-select:none}
.scene{position:absolute;inset:0;background-color:#83b96b;background-image:linear-gradient(0deg,transparent 24%,#6e9e5b 25%,#6e9e5b 26%,transparent 27%,transparent 74%,#6e9e5b 75%,#6e9e5b 76%,transparent 77%),linear-gradient(90deg,transparent 24%,#6e9e5b 25%,#6e9e5b 26%,transparent 27%,transparent 74%,#6e9e5b 75%,#6e9e5b 76%,transparent 77%);background-size:64px 64px}
.path{position:absolute;left:0;top:42%;width:100%;height:25%;background:#d5c18e;border-top:5px solid #b69a69;border-bottom:5px solid #b69a69;box-shadow:inset 0 5px #ead8ad,inset 0 -5px #c7ad7b}
.path:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed #b99e72}
.school{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(58%,360px);height:27%;background:#d8c49a;border:7px solid #75563b;box-shadow:0 8px #4f4935}
.school:before{content:"";position:absolute;left:0;right:0;top:0;height:24%;background:#9a5f48;border-bottom:5px solid #684733}
.school:after{content:"校園教學大樓";position:absolute;top:34%;left:0;right:0;text-align:center;color:#59432e;font-weight:900;font-size:clamp(12px,3vw,18px);text-shadow:1px 1px #f5e6c2}
.window{position:absolute;top:58%;width:13%;height:25%;background:#8bb4b4;border:4px solid #70533a}
.window.w1{left:10%}.window.w2{left:33%}.window.w3{right:33%}.window.w4{right:10%}
.tree{position:absolute;width:66px;height:66px;border:5px solid #54733f;border-radius:12px;background:#43864d;box-shadow:inset 8px 8px #72a95a, inset -8px -8px #326d45,0 7px #6d583a}
.tree:after{content:"";position:absolute;width:22px;height:16px;background:#7e5b39;left:17px;top:56px}
.t1{left:7%;top:17%}.t2{right:8%;top:22%}.t3{left:12%;bottom:13%}.t4{right:12%;bottom:13%}
.flower{position:absolute;width:14px;height:14px;background:#f4d77b;border:3px solid #fff0b0;box-shadow:18px 10px #e98d9b,35px -4px #fff0b0}
.f1{left:28%;top:76%}.f2{right:29%;top:76%}
.topbar{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.panel{background:linear-gradient(135deg,#806448,#503d30);border:3px solid #d8bd82;box-shadow:inset 0 0 0 2px #3f3028,0 3px #33271f;border-radius:8px;padding:7px 9px;color:#fff2d1;text-shadow:1px 1px #35271e}
.profile{display:flex;gap:8px;min-width:174px}.portrait{width:43px;height:43px;border:3px solid #e9d39b;background:linear-gradient(#e7c8a1 0 36%,#513e37 37% 55%,#41617a 56%);position:relative}
.portrait:before{content:"";position:absolute;width:20px;height:22px;left:9px;top:4px;background:#e9b98f;border:3px solid #563d30;border-radius:5px}
.portrait:after{content:"";position:absolute;width:25px;height:9px;left:6px;top:1px;background:#513b2e}
.name{font-size:12px;font-weight:900;white-space:nowrap}.bars{width:112px;margin-top:4px}.bar{height:8px;background:#342d29;border:1px solid #211d1a;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;width:78%;background:#d45d51}.bar.mp i{width:62%;background:#5597cf}.level{font-size:10px;color:#ffe7a6}
.minimap{width:92px;height:78px;padding:5px;position:relative;background:#6c9b59;border:4px solid #d9bd83;box-shadow:inset 0 0 0 2px #493729}
.minimap:before{content:"";position:absolute;left:5%;top:43%;width:90%;height:15%;background:#d7c18e}.minimap:after{content:"";position:absolute;left:46%;top:7%;height:86%;width:12%;background:#d7c18e}
.mapdot{position:absolute;z-index:2;left:53%;top:51%;width:8px;height:8px;background:#e95d4f;border:2px solid white;border-radius:50%}
.quest{position:absolute;z-index:4;top:105px;left:10px;max-width:170px;font-size:11px;line-height:1.6}.quest b{color:#ffe49a}
.char{position:absolute;z-index:3;left:50%;top:56%;width:34px;height:53px;transform:translate(-50%,-50%);transition:left .07s linear,top .07s linear;filter:drop-shadow(3px 4px 0 #40533c)}
.char .head{position:absolute;left:8px;top:0;width:19px;height:18px;background:#f0bd91;border:3px solid #553e31;border-radius:5px}
.char .hair{position:absolute;left:7px;top:-3px;width:22px;height:9px;background:#423128;border:2px solid #2c241f}
.char .body{position:absolute;left:5px;top:17px;width:25px;height:23px;background:#426c91;border:3px solid #263d50}
.char .body:after{content:"";position:absolute;left:8px;top:0;height:17px;border-left:3px solid #e9dfc7}
.char .legs{position:absolute;left:7px;top:39px;width:8px;height:13px;background:#3c3430;box-shadow:12px 0 #3c3430}
.char.moving{animation:bob .18s steps(2) infinite alternate}@keyframes bob{to{margin-top:-3px}}
.npc{position:absolute;z-index:2;left:67%;top:48%;font-size:28px;filter:drop-shadow(2px 3px #52603c)}.npc-label{position:absolute;left:calc(67% - 10px);top:45%;font-size:10px;color:#fff;text-shadow:1px 1px #332}
.chat{position:absolute;left:10px;bottom:12px;z-index:4;width:min(43%,220px);font-size:10px;line-height:1.5;opacity:.94}
.chat .panel{padding:6px 8px}.chat b{color:#ffdf8e}
.exp{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:9px;width:34%;height:9px;background:#342d29;border:2px solid #e4ca8c;border-radius:2px}.exp i{display:block;width:37%;height:100%;background:#e3c35f}
.controls{position:absolute;z-index:8;inset:0;pointer-events:none}
.joy-area{position:absolute;left:20px;bottom:38px;width:132px;height:132px;pointer-events:auto;touch-action:none}
.joy-base{position:absolute;inset:0;border-radius:50%;background:#3b4c48a8;border:3px solid #e3d1a0;box-shadow:inset 0 0 0 5px #756348aa}
.joy-knob{position:absolute;left:50%;top:50%;width:53px;height:53px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#e8d4a2,#9e8053);border:4px solid #fff0c6;box-shadow:0 4px #59442f}
.joy-label{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);font-size:10px;color:#fff;text-shadow:1px 2px #333;white-space:nowrap}
.action-area{position:absolute;right:52px;bottom:35px;width:1px;height:1px;pointer-events:none}
.attack{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;pointer-events:auto;touch-action:manipulation;background:linear-gradient(145deg,#e4b66d,#a65e36);border:4px solid #ffe1a1;box-shadow:inset 0 0 0 4px #70452d,0 5px #513a2b;color:#fff4d2;font-size:27px;text-shadow:2px 2px #70452d;display:grid;place-items:center}
.attack small{position:absolute;bottom:7px;font-size:9px;font-weight:900}
.skill{position:absolute;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto;touch-action:manipulation;background:linear-gradient(145deg,#83b4c7,#426b8a);border:3px solid #d9edee;box-shadow:inset 0 0 0 3px #35536b,0 4px #263b49;color:#fff;font-size:21px;text-shadow:1px 2px #294354;display:grid;place-items:center}
.skill small{position:absolute;bottom:2px;font-size:8px;font-weight:900}
.skill.cooling{filter:grayscale(.8);opacity:.72}.skill:active,.attack:active{filter:brightness(1.25);transform:translate(-50%,-50%) scale(.94)}
/* 四個技能中心以普通攻擊中心為圓心，半徑 106px；角度 240°/290°/340°/390°，每格相差 50° */
.action-area .skill:nth-child(1){left:-91.8px;top:53px}
.action-area .skill:nth-child(2){left:-99.6px;top:-36.3px}
.action-area .skill:nth-child(3){left:-36.3px;top:-99.6px}
.action-area .skill:nth-child(4){left:18.4px;top:-104.4px}
.quick{position:absolute;z-index:6;right:10px;top:105px;display:flex;flex-direction:column;gap:6px}
.quick button{width:39px;height:39px;border:2px solid #e8d3a0;border-radius:7px;background:#72563e;color:#fff1ca;font-size:18px;box-shadow:0 3px #3e3026}
.toast{position:absolute;z-index:20;left:50%;top:43%;transform:translate(-50%,-50%);background:#46362b;border:3px solid #e5c987;padding:10px 16px;color:#fff0c7;font-weight:900;font-size:13px;box-shadow:0 4px #29211c;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.show{opacity:1}
@media(min-width:700px){#game{max-width:480px;height:min(100vh,900px);height:min(100dvh,900px);margin:auto;border-left:5px solid #4b3a2b;border-right:5px solid #4b3a2b}.topbar{left:12px;right:12px}.joy-area{left:22px}.action-area{right:52px}}
@media(max-height:620px){.joy-area{width:108px;height:108px;bottom:25px}.joy-knob{width:45px;height:45px}.attack{width:66px;height:66px}.skill{width:48px;height:48px}.action-area .skill:nth-child(1){left:-82px;top:47px}.action-area .skill:nth-child(2){left:-89px;top:-32px}.action-area .skill:nth-child(3){left:-32px;top:-89px}.action-area .skill:nth-child(4){left:16px;top:-93px}}

/* 橫向手機版：完整寬螢幕遊戲配置 */
@media (orientation:landscape) and (min-width:600px){
#game{width:100vw;max-width:none;height:100dvh;margin:0;border:0}
.school{top:13%;left:50%;width:min(42%,520px);height:31%}
.path{top:51%;height:23%}.tree{width:58px;height:58px}
.t1{left:8%;top:23%}.t2{right:8%;top:20%}.t3{left:22%;bottom:10%}.t4{right:22%;bottom:10%}
.topbar{top:8px;left:12px;right:12px}.profile{min-width:168px;padding:5px 8px}
.portrait{width:36px;height:36px}.bars{width:104px}.minimap{width:82px;height:68px}
.quest{top:88px;left:12px;max-width:150px;font-size:10px;padding:5px 8px}
.char{top:59%}.npc{left:65%;top:49%}.npc-label{left:calc(65% - 10px);top:46%}
.chat{left:170px;bottom:8px;width:min(30%,260px)}.exp{bottom:8px;width:25%}
.joy-area{left:22px;bottom:18px;width:104px;height:104px}.joy-knob{width:44px;height:44px}
.action-area{right:118px;bottom:78px}.attack{width:68px;height:68px}.skill{width:48px;height:48px}
.action-area .skill:nth-child(1){left:-79px;top:45.6px}
.action-area .skill:nth-child(2){left:-85.7px;top:-31.2px}
.action-area .skill:nth-child(3){left:-31.2px;top:-85.7px}
.action-area .skill:nth-child(4){left:15.8px;top:-89.8px}
.quick{top:88px;right:12px;flex-direction:row}
}
@media (orientation:landscape) and (max-height:430px){
.profile{transform:scale(.88);transform-origin:top left}.quest{top:68px}
.joy-area{width:88px;height:88px;left:16px;bottom:12px}.joy-knob{width:38px;height:38px}
.action-area{right:98px;bottom:65px}.attack{width:60px;height:60px}.skill{width:43px;height:43px}
.action-area .skill:nth-child(1){left:-71px;top:41px}
.action-area .skill:nth-child(2){left:-77px;top:-28px}
.action-area .skill:nth-child(3){left:-28px;top:-77px}
.action-area .skill:nth-child(4){left:14px;top:-81px}
.chat{left:120px;font-size:9px}.exp{width:22%}.quick{top:66px}
}
</style></head>
<body><main id="game" aria-label="亂校園手機遊戲介面">
<div class="scene"><div class="school"><i class="window w1"></i><i class="window w2"></i><i class="window w3"></i><i class="window w4"></i></div><div class="path"></div><i class="tree t1"></i><i class="tree t2"></i><i class="tree t3"></i><i class="tree t4"></i><i class="flower f1"></i><i class="flower f2"></i></div>
<div class="topbar"><div class="panel profile"><div class="portrait"></div><div><div class="name">見習生　Lv.12</div><div class="bars"><div class="bar"><i></i></div><div class="bar mp"><i></i></div></div><div class="level">HP 780/1000　MP 320/500</div></div></div><div class="minimap"><span class="mapdot"></span></div></div>
<div class="quest panel"><b>新手任務</b><br>・與校園導師交談<br>・探索校園周圍</div>
<div class="npc">🧑🏻‍🏫</div><div class="npc-label">校園導師</div>
<div class="char" id="character"><i class="hair"></i><i class="head"></i><i class="body"></i><i class="legs"></i></div>
<div class="chat"><div class="panel"><b>系統：</b>歡迎來到亂校園！<br><span id="chatline">使用左側搖桿移動，右側按鈕戰鬥。</span></div></div>
<div class="exp"><i></i></div>
<div class="quick"><button data-msg="背包尚未開放">▣</button><button data-msg="角色資料尚未開放">♟</button><button data-msg="任務列表已開啟">☷</button></div>
<div class="controls"><div class="joy-area" id="joy"><div class="joy-base"></div><div class="joy-knob" id="knob"></div><div class="joy-label">移動</div></div>
<div class="action-area" id="action">
<button class="skill" data-skill="技能一" aria-label="技能一">✦<small>1</small></button>
<button class="skill" data-skill="技能二" aria-label="技能二">❖<small>2</small></button>
<button class="skill" data-skill="技能三" aria-label="技能三">✧<small>3</small></button>
<button class="skill" data-skill="技能四" aria-label="技能四">✹<small>4</small></button>
<button class="attack" id="attack" aria-label="普通攻擊">⚔<small>攻擊</small></button>
</div></div>
<div class="toast" id="toast"></div></main>
<script>
const game=document.getElementById('game'),char=document.getElementById('character'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),toast=document.getElementById('toast'),chatline=document.getElementById('chatline');
let x=50,y=56,joyPointer=null,joyVector={x:0,y:0},keyboardVector={x:0,y:0},move={x:0,y:0},toastTimer;
function refreshMove(){let vx=joyVector.x+keyboardVector.x,vy=joyVector.y+keyboardVector.y,len=Math.hypot(vx,vy)||1;if(Math.hypot(vx,vy)>1){vx/=len;vy/=len}move={x:vx,y:vy}}
function say(t){toast.textContent=t;toast.classList.add('show');chatline.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1050)}
function render(){char.style.left=x+'%';char.style.top=y+'%';char.classList.toggle('moving',Math.abs(move.x)+Math.abs(move.y)>.1)}
function moveCharacter(dx,dy){const r=game.getBoundingClientRect();x=Math.max(8,Math.min(92,x+dx/r.width*100));y=Math.max(28,Math.min(88,y+dy/r.height*100));render()}
function joyUpdate(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=42,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.left='calc(50% + '+dx+'px)';knob.style.top='calc(50% + '+dy+'px)';joyVector={x:dx/max,y:dy/max};refreshMove()}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyUpdate(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyUpdate(e)});
function joyEnd(){joyPointer=null;joyVector={x:0,y:0};refreshMove();knob.style.left='50%';knob.style.top='50%';char.classList.remove('moving')}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);joy.addEventListener('lostpointercapture',joyEnd);
let last=0;function loop(t){if(t-last>28){if(Math.abs(move.x)+Math.abs(move.y)>.08)moveCharacter(move.x*2.1,move.y*2.1);last=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();say('普通攻擊！');char.animate([{transform:'translate(-50%,-50%) rotate(-8deg)'},{transform:'translate(-50%,-50%) rotate(10deg)'},{transform:'translate(-50%,-50%) rotate(0)'}],{duration:220})});
document.querySelectorAll('.skill').forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();say('施放 '+b.dataset.skill+'！');b.classList.add('cooling');setTimeout(()=>b.classList.remove('cooling'),900)}));
document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>say(b.dataset.msg)));
const heldKeys=new Set();
function syncKeyboardMove(){const left=heldKeys.has('a')||heldKeys.has('arrowleft'),right=heldKeys.has('d')||heldKeys.has('arrowright'),up=heldKeys.has('w')||heldKeys.has('arrowup'),down=heldKeys.has('s')||heldKeys.has('arrowdown');const kx=(right?1:0)-(left?1:0),ky=(down?1:0)-(up?1:0),len=Math.hypot(kx,ky)||1;keyboardVector={x:kx/len,y:ky/len};if(!kx&&!ky)keyboardVector={x:0,y:0};refreshMove()}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();heldKeys.add(k);syncKeyboardMove()}else if(k===' '&&!e.repeat){e.preventDefault();document.getElementById('attack').dispatchEvent(new Event('pointerdown',{cancelable:true}))}else if('1234'.includes(k)&&!e.repeat){document.querySelectorAll('.skill')[Number(k)-1].dispatchEvent(new Event('pointerdown',{cancelable:true}))}});
document.addEventListener('keyup',e=>{heldKeys.delete(e.key.toLowerCase());syncKeyboardMove()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){heldKeys.clear();keyboardVector={x:0,y:0};joyVector={x:0,y:0};refreshMove();knob.style.left='50%';knob.style.top='50%'}});
window.addEventListener('blur',()=>{heldKeys.clear();keyboardVector={x:0,y:0};refreshMove()});
</script></body></html>
